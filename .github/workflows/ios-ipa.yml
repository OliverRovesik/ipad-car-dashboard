name: iOS ipa build

# 只允许手动触发或打 tag 触发：不响应 pull_request，避免任何 fork 用这个仓库跑构建。
# 产物是未签名 ipa，签名由使用者本地完成（Sideloadly / 企业证书 / TestFlight）。
on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: iOS deployment target
        required: false
        default: "15.0"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-version) @ $(xcrun --sdk iphoneos --show-sdk-path)"

      - name: Build
        env:
          DEPLOY_TARGET: ${{ github.event.inputs.deploy_target || '15.0' }}
        run: |
          set +e
          sh app/build-ipa.sh 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::build failed (exit $rc)"
            grep -E "error:|fatal error" build.log | head -15 | sed 's/^/::error::/'
            exit "$rc"
          fi
          echo "::notice::ipa built: $(ls -la app/build/CarDash-unsigned.ipa | awk '{print $5}') bytes"

      - name: Simulator smoke test
        env:
          DEPLOY_TARGET: ${{ github.event.inputs.deploy_target || '15.0' }}
        run: |
          set +e
          sh app/simtest.sh 2>&1 | tee simtest.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::sim smoke test exited $rc"
            tail -25 simtest.log | sed 's/^/::error::/'
            exit "$rc"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CarDash-unsigned
          path: app/build/CarDash-unsigned.ipa
          if-no-files-found: error
