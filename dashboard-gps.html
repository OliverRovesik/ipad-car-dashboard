<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Fiesta · Drive Display (GPS)</title>
<!--
  本版数据源是 GPS，不是 OBD：转速/水温/电压/节气门/故障灯一律不显示，
  因为 GPS 拿不到这些，伪造它们比不显示更糟。
  依赖与素材
  - three.min.js / GLTFLoader.js  r128, MIT (c) 2010-2021 three.js authors，本地副本，无 CDN 依赖
  - model/fiesta.data.js  内嵌的 "2013 Ford Fiesta ST" 模型(base64)，原文件不在仓库里。
    作者 Ddiaz Design, https://sketchfab.com/ddiaz-design
    授权 CC-BY-NC-SA-4.0 —— 署名 + 非商业 + 相同方式共享。再分发时须保留本注释。
    换模型时从 .glb 重新生成：见 model/fiesta.data.js 文件头的一行命令。
  - 内联的 window.__CAT_GLB  左下角那只猫，作者 Vuena, https://vuena.itch.io/blocky-pets-wildlife，
    授权 CC0 1.0 Universal（公有领域，可任意改、可商用、无需署名）。
    原图是橘色虎斑、两眼深绿，被重绘成白色异瞳（正面看左眼琥珀、右眼蓝），并删掉 LOD1 那份重复网格
    和它带出的孤立数据（12 段动画一段没删，随机播放要用），917KB -> 575KB。
    重绘规则：橘毛按原饱和度压暗成米白（否则条纹和阴影会跟着颜色一起被抹平）。
-->
<style>
  :root{
    --bg:#eef1f5; --ink:#0d1319; --sub:#68727f; --card:rgba(255,255,255,.82);
    --line:rgba(120,132,148,.28); --green:#12a15c; --amber:#c98a00; --red:#d92d20;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  body{font:15px/1.35 -apple-system,"SF Pro Display",system-ui,sans-serif;color:var(--ink);
    -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none}
  #search input{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
  #scene{position:fixed;inset:0}
  #scene canvas{display:block;touch-action:none}

  .ov{position:fixed;z-index:3}
  /* 顶部三个区块放进一条 flex 行：绝对定位的三块在窄窗口下必然互相重叠 */
  #topbar{left:clamp(12px,1.6vw,26px);right:clamp(12px,1.6vw,26px);top:clamp(10px,1.6vh,20px);
    display:flex;align-items:flex-start;align-content:flex-start;justify-content:space-between;
    flex-wrap:wrap;gap:clamp(8px,1.2vw,18px)}
  #topbar .ov{position:static;z-index:auto}
  #topbar span, #topbar b, #clockwx{white-space:nowrap}

  /* 左上：档位 + 车速 */
  #topleft{display:flex;flex-direction:column;gap:2px;flex:0 0 auto}
  #gearrow{display:flex;gap:clamp(9px,1.2vw,16px);font-size:clamp(15px,1.7vw,21px);
    font-weight:600;color:var(--sub);letter-spacing:.02em}
  #gearrow .dim{opacity:.35}
  #ready{margin-left:6px;font-size:14px;font-weight:700;letter-spacing:.14em;color:var(--green);
    align-self:center}
  #ready.off{color:var(--sub)}
  #speed{font-size:clamp(52px,7.6vw,104px);font-weight:300;line-height:.86;
    letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  #speedunit{font-size:17px;color:var(--sub);font-weight:600;margin-top:2px}

  /* 右上：OBD 读数 */
  #obd{display:flex;gap:clamp(6px,.8vw,10px);flex-wrap:wrap;justify-content:flex-end;
    flex:1 1 auto}
  .card{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);
    border-radius:clamp(10px,1.2vw,15px);padding:clamp(5px,.9vh,9px) clamp(8px,1vw,15px);
    min-width:clamp(62px,7.4vw,96px);text-align:right}
  .card span{display:block;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--sub);font-weight:700}
  .card b{display:block;font-size:clamp(17px,2.1vw,26px);font-weight:600;
    font-variant-numeric:tabular-nums;line-height:1.15}
  .card.warn b{color:var(--amber)} .card.bad b{color:var(--red)}

  /* 右下：里程 */
  #trip{right:clamp(14px,2vw,24px);bottom:calc(clamp(56px,14vh,112px) + env(safe-area-inset-bottom,0px));text-align:right;cursor:pointer}
  #trip span{font-size:11px;letter-spacing:.12em;color:var(--sub);font-weight:700;text-transform:uppercase}
  #trip b{display:block;font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}
  #trip small{font-size:13px;color:var(--sub);font-weight:600}

  /* 左下：无底框的浮动白猫，位置完全由脚本写 left/top，可拖到屏幕任意位置 */
  #cat{width:150px;height:150px;touch-action:none;cursor:grab}
  #cat.dragging{cursor:grabbing}
  #cat canvas{display:block;width:100%;height:100%}
  #cat.gone{display:none}

  /* 底部状态 */
  /* 顶部中央：日期 / 时间 / 天气 */
  #clockwx{display:flex;align-items:center;gap:clamp(8px,1vw,14px);
    background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);
    border-radius:16px;padding:clamp(5px,.9vh,8px) clamp(10px,1.4vw,18px);
    flex:0 0 auto}
  #clkTime{font-size:clamp(24px,2.9vw,34px);font-weight:600;
    font-variant-numeric:tabular-nums}
  #clkDate{font-size:clamp(14px,1.6vw,18px);color:var(--sub);font-weight:600}
  #wx{font-size:clamp(16px,2.0vw,22px);font-weight:600;color:var(--sub);
    border-left:1px solid var(--line);padding-left:clamp(8px,1vw,14px)}
  #wx.bad{color:var(--amber)}
  #hint{left:50%;bottom:calc(clamp(12px,2.4vh,18px) + 62px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);transition:opacity .5s}
  #hint.gone{opacity:0}

  /* 常用地点：点了直接交给谷歌地图 */
  #favbar{left:clamp(12px,1.6vw,26px);bottom:calc(clamp(12px,2.4vh,18px) + env(safe-area-inset-bottom,0px));display:flex;
    gap:clamp(8px,1vw,14px);align-items:center;flex-wrap:wrap}
  .fav{background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:24px;padding:11px 20px;
    font-size:clamp(15px,1.6vw,20px);font-weight:700;color:var(--ink);text-decoration:none;
    display:flex;align-items:center;gap:9px;white-space:nowrap;transition:transform .12s}
  .fav:active{transform:scale(.94)}
  /* 搜索交给谷歌地图自己搜。input 字号下限必须 >=16px，否则 iOS Safari 聚焦时会把整页放大 */
  #search{display:flex;align-items:center;gap:8px;background:var(--card);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:24px;padding:4px 4px 4px 16px}
  #search input{-webkit-appearance:none;appearance:none;border:0;outline:0;background:transparent;
    color:var(--ink);font-family:inherit;font-weight:600;font-size:clamp(16px,1.6vw,20px);
    width:clamp(150px,26vw,240px);min-width:0;align-self:stretch}
  #search input::placeholder{color:var(--sub);font-weight:600;opacity:1}
  #search input::-webkit-search-decoration,
  #search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
  #search button{-webkit-appearance:none;appearance:none;border:0;cursor:pointer;
    background:rgba(120,132,148,.18);color:var(--ink);border-radius:19px;padding:9px 15px;
    font-family:inherit;font-weight:700;font-size:clamp(16px,1.6vw,20px);transition:transform .12s}
  #search button:active{transform:scale(.94)}
  /* 窄到 1/3 分屏那一侧时收藏+搜索会换成两行，提示条要让出来 */
  @media (max-width:640px){ #hint{bottom:calc(clamp(12px,2.4vh,18px) + 118px + env(safe-area-inset-bottom,0px))} }
  .chip{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);
    border-radius:20px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--sub);
    display:flex;align-items:center;gap:7px}
  #wlwarn.hidden{display:none}
  .chip.sim{color:#8a5a00;background:rgba(255,224,150,.72);border-color:rgba(200,150,20,.35)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--sub)}
  .dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(18,161,92,.18)}
  .dot.off{background:var(--red)}

  #load{left:50%;top:50%;transform:translate(-50%,-50%);font-size:14px;font-weight:600;
    color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 20px}
  #load.bad{color:var(--red)}
  #load.hidden{display:none}

  /* 滚动歌词：浮动卡片，默认落在速度块下方，可整张拖到屏幕任意位置；默认 2 行：
     当前行顶格加粗、下一行淡显；字体尽量大，开车扫一眼能读。
     拉右边改宽度、拉下边改行数（1–6 行）、右下角两个一起改；位置和尺寸都记进 localStorage。
     数据来自原生壳（Apple Music 的 now-playing 状态 + 专辑封面），网页只负责按时间轴滚动。 */
  #lyrics{width:clamp(232px,19vw,248px);
    position:relative;
    background:var(--card);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border:1px solid var(--line);border-radius:16px;
    padding:8px 10px;
    display:flex;flex-direction:column;gap:5px;
    box-shadow:0 14px 36px rgba(8,14,22,.16)}
  #lyrics.hidden{display:none}
  #lyrics.sizing{border-color:var(--sub)}
  #lyrics.dragging{cursor:grabbing;border-color:var(--sub)}
  /* 顶栏里 .ov 一律被改成 static；歌词卡是浮动层，脱离顶栏排版、可拖到屏幕任意位置。 */
  #topbar #lyrics{position:fixed;z-index:6;touch-action:none}
  #lyrHead{display:flex;align-items:center;gap:8px}
  #lyrArt{width:40px;height:40px;border-radius:10px;object-fit:cover;flex:0 0 auto;
    background:rgba(120,132,148,.16)}
  #lyrArt.hidden{display:none}
  #lyrMeta{min-width:0;flex:1 1 auto}
  #lyrTitle{font-size:clamp(14px,1.5vw,17px);font-weight:700;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  #lyrArtist{font-size:12px;color:var(--sub);font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #lyrClose{min-width:24px;min-height:24px;padding:0;border:0;background:transparent;
    color:var(--sub);font-size:15px;border-radius:8px}
  #lyrView{position:relative;--lh:38px;--rows:2;height:calc(var(--lh) * var(--rows));
    overflow:hidden;
    -webkit-mask-image:linear-gradient(#000 82%,transparent);
    mask-image:linear-gradient(#000 82%,transparent)}
  #lyrView[data-rows="1"]{-webkit-mask-image:none;mask-image:none}
  #lyrList{list-style:none;transition:transform .5s cubic-bezier(.22,.61,.36,1);will-change:transform}
  #lyrList li{height:var(--lh);line-height:var(--lh);font-size:clamp(22px,2.8vw,30px);
    color:var(--sub);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    opacity:.55;transition:opacity .3s,color .3s}
  #lyrList li.on{color:var(--ink);opacity:1;font-weight:800}
  #lyrMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;font-size:13px;line-height:1.3;color:var(--sub);font-weight:600;padding:0 6px}
  #lyrMsg.hidden{display:none}
  .lyrBtn{-webkit-appearance:none;appearance:none;border:1px solid var(--line);
    background:rgba(120,132,148,.14);color:var(--ink);border-radius:9px;
    min-width:30px;min-height:24px;padding:0 7px;cursor:pointer;
    font-family:inherit;font-size:12px;font-weight:700;transition:transform .12s}
  .lyrBtn:active{transform:scale(.93)}
  #lyrOpen{align-self:flex-start;margin-top:clamp(6px,2.2vh,20px);z-index:4;
    cursor:pointer;border:1px solid var(--line);background:var(--card);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-radius:14px;color:var(--sub);padding:10px 9px;font-size:16px;font-weight:700}
  #lyrOpen.hidden{display:none}
  /* 拉伸手柄：贴在卡片右/下/右下角外侧的透明条，触控热区 ≥20px。
     top/left 让开 ✕ 按钮，免得误拉当成关闭。右下角画个小 L 提示可以拉。 */
  .lyrSz{position:absolute;z-index:3;touch-action:none}
  #lyrSzE{top:60px;bottom:8px;right:-12px;width:24px;cursor:ew-resize}
  #lyrSzS{left:8px;right:34px;bottom:-12px;height:24px;cursor:ns-resize}
  #lyrSzSE{right:-12px;bottom:-12px;width:32px;height:32px;cursor:nwse-resize}
  #lyrSzSE::before{content:'';position:absolute;right:7px;bottom:7px;width:10px;height:10px;
    border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);
    border-radius:0 0 8px 0;opacity:.6}

  /* iPad 开夜间模式时整屏跟着变暗 */
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1216; --ink:#eef2f7; --sub:#8b98a8; --card:rgba(22,28,36,.82);
      --line:rgba(150,165,185,.2); --green:#2fd07d; --amber:#f0b429; --red:#ff5c5c;
    }
    #wlwarn.hidden{display:none}
  .chip.sim{color:#f0c060;background:rgba(120,86,10,.5);border-color:rgba(200,150,20,.3)}
  }
</style>
</head>
<body>
<div id="scene"></div>

<div class="ov" id="topbar">
  <div class="ov" id="topleft">
  <div id="gearrow"><i data-g="P" class="dim">P</i><i data-g="R" class="dim">R</i>
    <i data-g="N">N</i><i data-g="D" class="dim">D</i><span id="ready">READY</span></div>
  <div id="speed">0</div>
  <div id="speedunit">km/h</div>
</div>

<!-- 滚动歌词：原生壳用 window.CarDashLyrics.setTrack/sync 推当前曲目、封面和播放进度，
     网页自己按单调时钟外推位置，0.5s 一次的进度更新不会让歌词一跳一跳 -->
<div class="ov hidden" id="lyrics" aria-live="polite">
  <div id="lyrHead">
    <img id="lyrArt" class="hidden" alt="" decoding="async">
    <div id="lyrMeta">
      <div id="lyrTitle">—</div>
      <div id="lyrArtist"></div>
    </div>
    <button class="lyrBtn" id="lyrClose" aria-label="Hide lyrics">✕</button>
  </div>
  <div id="lyrView">
    <ul id="lyrList"></ul>
    <div id="lyrMsg">Play something in Apple Music</div>
  </div>
  <div class="lyrSz" id="lyrSzE" aria-hidden="true"></div>
  <div class="lyrSz" id="lyrSzS" aria-hidden="true"></div>
  <div class="lyrSz" id="lyrSzSE" aria-hidden="true"></div>
</div>
<div class="ov hidden" id="lyrOpen" role="button" aria-label="Show lyrics">♪</div>

<div class="ov" id="clockwx">
  <div><div id="clkTime">--:--</div></div>
  <div id="clkDate">—</div>
  <div id="wx">—</div>
</div>

<div class="ov" id="obd">
  <div class="card" id="cAvg"><span>Avg speed</span><b id="vAvg">—</b></div>
  <div class="card" id="cPrec"><span>Accuracy</span><b id="vPrec">—</b></div>
</div>
</div>

<div class="ov chip" id="hint">← Drag to orbit the car →</div>

<div class="ov" id="trip"><span>Trip</span><b id="vTrip">0.0</b><small>km · tap to reset</small></div>

<!-- 左下角浮动白猫：第二个 WebGL renderer 画在透明容器里，整只可以拖到任意位置 -->
<div class="ov" id="cat"><canvas id="catCv"></canvas></div>

<!-- destination 坐标取自他给的 maps.app.goo.gl 短链解析结果；dir_action=navigate 让谷歌地图接到就直接开始导航 -->
<div class="ov" id="favbar">
  <a class="fav" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&amp;travelmode=driving&amp;dir_action=navigate&amp;destination=14.6342128,121.0166671">🏠 Home</a>
  <a class="fav" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&amp;travelmode=driving&amp;dir_action=navigate&amp;destination=14.6685938,121.0116962">💼 Work</a>
  <a class="fav" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&amp;travelmode=driving&amp;dir_action=navigate&amp;destination=14.5564398,120.9956354">❤️</a>
  <!-- 谷歌地图没有对外"结束导航"的接口；这个按钮把谷歌地图交回前台（导航中会直接回到导航页），✕ 在它那页里按 -->
  <a class="fav" target="_blank" rel="noopener" href="comgooglemaps://">❌</a>
  <!-- GET 表单让浏览器自己拼 query=，零 JS、不受弹窗拦截，页面本身不被导航走。
       api=1 必须是隐藏字段：规范里表单 GET 会用自己序列化出的 query 整体替换 action 上的 query。 -->
  <form id="search" method="GET" target="_blank" rel="noopener"
        action="https://www.google.com/maps/search/">
    <input type="hidden" name="api" value="1">
    <input name="query" type="search" required maxlength="120" autocomplete="off" spellcheck="false"
           enterkeyhint="search" aria-label="Search Google Maps" placeholder="Search Google Maps">
    <button type="submit" aria-label="Search in Google Maps">🔍</button>
  </form>
</div>

<div class="ov" id="load">Loading vehicle model…</div>

<script src="vendor/three.min.js"></script>

<script>
/* GPS 版数据接口：只有 GPS 真能给出的量。
   speed 来自 coords.speed；为 null 时退化成由相邻定位点的位移推算。
   档位没有数据源，所以 P R N D 只反映"停车/行驶"，R 常暗。 */
const D = { speed:0, connected:false };
const shown = { speed:0 };
const G = { acc:null, head:null, src:'—', lat:null, lon:null, posTs:0, movingSec:0 };

/* ---------- 场景 ---------- */
const Z_EGO = 3.2;                    // 车尾离相机的距离(米)
const CAR_LEN = 3.97;                 // Fiesta ST 实车长度(米)，用来归一模型
const LANE = 3.4, HALF = LANE*1.5;    // 三车道，路面半宽 5.1m
// 模型车头朝向：导出时车头朝 -Z，跟车视角要看到车尾，所以翻 180°
const CAR_YAW = Math.PI;

// 昼夜两套场景配色。tail 是尾灯自发光强度：夜间亮，白天灭。
const THEME = {
  light:{ sky:0xeef1f5, road:0xccd3db, shoulder:0xcfd5dd, edge:0xb6bfca, dash:0x98a3b1, floor:0xd3dae3,
          hemi:0.95, sun:0.50, ground:0xb6bfc9, beam:0 },
  dark: { sky:0x0e1216, road:0x1b2129, shoulder:0x151b22, edge:0x2a333f, dash:0x465262, floor:0x161c24,
          hemi:0.34, sun:0.24, ground:0x0c1014, beam:0.85 },
};
let tailMats = [], rearSign = 0, beams = [], paintMats = [], headSprites = [];
const SHEEN_DAY = 1.75, SHEEN_NIGHT = 0.46;   // 车漆反射强度
const PAINT = 0x020c41;                // 车漆：1号(#000538) 与 2号(#04144a) 的正中间；发黑主要靠光泽解决

let renderer, scene, camera, dashes = [];
try{
  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.getElementById('scene').appendChild(renderer.domElement);
}catch(e){
  const el=document.getElementById('load');
  el.className='bad'; el.textContent='WebGL unavailable on this device: '+e.message; throw e;
}

scene = new THREE.Scene();
scene.background = new THREE.Color(THEME.light.sky);
scene.fog = new THREE.Fog(THEME.light.sky, 55, 240);   // 远处路面融进背景，替代地平线硬边

camera = new THREE.PerspectiveCamera(58, 1, 0.1, 400);

/* ---------- 停车环绕 / 驾驶视角 + 转场 ---------- */
// 车中心在模型加载完成后按实际尺寸校正；这里先给一个等尺寸估计值
const carCenter = new THREE.Vector3(0, 0.78, -(Z_EGO + CAR_LEN/2));
const CAM = { mode:'park', az:2.42, el:0.34, k:0, stopped:0 };
let lastMode = 'park';
const DRIVE_P = new THREE.Vector3(0, 2.45, 0), DRIVE_L = new THREE.Vector3(0, .5, -10);
const _p = new THREE.Vector3(), _l = new THREE.Vector3(), _t = new THREE.Vector3();
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

function parkView(){
  const r = 6.4;
  _p.set(Math.sin(CAM.az)*r, carCenter.y + 0.55 + CAM.el*2.2, carCenter.z + Math.cos(CAM.az)*r);
  _l.copy(carCenter).add(_t.set(0, -0.05, 0));
}
// 惯性：松手后角速度指数衰减继续转。dt=0 的初始化调用必须先返回——那时 drag/FLICK 还没声明。
function applyFlick(dt){
  if(!dt || drag) return;
  if(CAM.mode!=='park'){ FLICK.az = FLICK.el = 0; return; }
  if(Math.abs(FLICK.az) < 0.02 && Math.abs(FLICK.el) < 0.02){ FLICK.az = FLICK.el = 0; return; }
  CAM.az += FLICK.az * dt;
  CAM.el  = Math.max(0.02, Math.min(0.55, CAM.el + FLICK.el * dt));
  if(CAM.el <= 0.02 || CAM.el >= 0.55) FLICK.el = 0;   // 撞到俯仰限位就卸掉这份动量
  const decay = Math.exp(-dt * 3.2);                   // 实测一次硬甩约 1.8s 收干、多转 110°
  FLICK.az *= decay; FLICK.el *= decay;
}
function updateCamera(dt){
  applyFlick(dt);
  CAM.k += ((CAM.mode==='drive'?1:0) - CAM.k) * Math.min(1, dt*3.2);   // 匀速逼近，约 1.2s
  const e = ease(Math.max(0, Math.min(1, CAM.k)));
  parkView();
  camera.position.lerpVectors(_p, DRIVE_P, e);
  _l.lerpVectors(_l, DRIVE_L, e);
  camera.lookAt(_l);
}
updateCamera(0);

// 拖动：两个轴都取反向，做成"抓住车身转"的手感——手指往哪走，车就往哪转。
// 只在停车模式生效；松手后把角速度交给 applyFlick 做惯性滑动。
let drag = null;
const FLICK = { az:0, el:0 };
const DRAG_K = 0.008, TILT_K = 0.0022, FLICK_MAX = 6;
const cvEl = renderer.domElement;
cvEl.addEventListener('pointerdown', e=>{
  if(CAM.mode!=='park') return;
  drag = { x:e.clientX, y:e.clientY, id:e.pointerId, t:performance.now() };
  FLICK.az = FLICK.el = 0;                     // 抓住即止，不和上一次甩动叠加
  cvEl.setPointerCapture(e.pointerId);
  hintDone = true; updateHint();
});
cvEl.addEventListener('pointermove', e=>{
  if(!drag || e.pointerId!==drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  const now = performance.now();
  const dt = Math.min(0.05, Math.max(0.008, (now - drag.t)/1000));   // 首帧/停顿都不给角速度尖峰
  CAM.az -= dx * DRAG_K;
  CAM.el  = Math.max(0.02, Math.min(0.55, CAM.el + dy * TILT_K));
  FLICK.az = Math.max(-FLICK_MAX, Math.min(FLICK_MAX, FLICK.az + (-dx*DRAG_K/dt - FLICK.az) * 0.4));
  FLICK.el = Math.max(-FLICK_MAX, Math.min(FLICK_MAX, FLICK.el + ( dy*TILT_K/dt - FLICK.el) * 0.4));
  drag.x = e.clientX; drag.y = e.clientY; drag.t = now;
});
const endDrag = ()=>{
  if(drag && performance.now() - drag.t > 90) FLICK.az = FLICK.el = 0;   // 抬指前已停手，就不甩
  drag = null;
};
let hintDone = false;
function updateHint(){
  document.getElementById('hint').classList.toggle('gone', hintDone || CAM.mode!=='park');
}
cvEl.addEventListener('pointerup', endDrag);
cvEl.addEventListener('pointercancel', endDrag);

const hemi = new THREE.HemisphereLight(0xffffff, 0xb6bfc9, 0.95);
const sun  = new THREE.DirectionalLight(0xffffff, 0.5);
// 停车视角的主光放在侧前方：绕着拖时一侧被照亮、一侧转进阴影，就是特斯拉那个感觉
const PARK_KEY = new THREE.Vector3(5.5, 5.2, 4.2), DRIVE_KEY = new THREE.Vector3(-3, 8, -6);
sun.position.copy(DRIVE_KEY);
const rim  = new THREE.DirectionalLight(0xdfe9ff, 0);   // 轮廓光，只在停车视角开
const fill = new THREE.DirectionalLight(0xfff4e2, 0);   // 补光，避免暗面死黑
rim.position.set(-6, 3.2, -5); fill.position.set(0, 6, 8);
scene.add(hemi, sun, rim, fill);

let TH = THEME.light, themeK = 1;
const clamp01 = v => Math.max(0, Math.min(1, v));
// renderer.outputEncoding = sRGBEncoding 会对输出做 linear->sRGB。
// 无光照的 MeshBasicMaterial 颜色是按 sRGB 写的，不先转线性就会被编码两次：
// 实测 0x161c24(22,28,36) 被提亮成 #4f5965(79,89,101)，夜间地面因此发灰。
const s2l = h => new THREE.Color(h).convertSRGBToLinear();
function applyLighting(){
  const e = ease(clamp01(CAM.k)), inv = 1 - e;        // 0=停车 1=驾驶
  hemi.intensity = (TH.hemi * e + 0.40 * inv) * themeK;
  sun.intensity  = (TH.sun  * e + 1.35 * inv) * themeK;
  rim.intensity  = 0.60 * inv * themeK;
  fill.intensity = 0.30 * inv * themeK;
  sun.position.lerpVectors(PARK_KEY, DRIVE_KEY, e);
}

const ground = {};
function plane(key, w, l, x, z, color){
  // depthWrite:false 是必须的：transparent 不等于不写深度。路面继续写深度的话，
  // 位于地面以下的倒影会因为"更远"而被深度测试整个拒掉，看起来像倒影没生效。
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, l),
    new THREE.MeshBasicMaterial({ color: s2l(color), transparent:true, depthWrite:false }));
  m.rotation.x = -Math.PI/2; m.position.set(x, 0, z);
  scene.add(m); (ground[key] = ground[key] || []).push(m); return m;
}
plane('road',     HALF*2, 420,   0, -190, 0xccd3db);      // 路面
plane('shoulder', 1.1, 420, -HALF-0.55, -190, 0xcfd5dd);  // 路肩
plane('shoulder', 1.1, 420,  HALF+0.55, -190, 0xcfd5dd);
plane('edge',     0.16, 420, -HALF+0.08, -190, 0xb6bfca); // 外边实线
plane('edge',     0.16, 420,  HALF-0.08, -190, 0xb6bfca);

// 车道虚线：每 7.5m 一段，随车速向相机方向回流
const dashGeo = new THREE.PlaneGeometry(0.14, 2.6);
const dashMat = new THREE.MeshBasicMaterial({ color: s2l(0x98a3b1), transparent:true, depthWrite:false });
for(const lx of [-LANE/2-0.05, LANE/2+0.05])
  for(let i=0;i<44;i++){
    const m = new THREE.Mesh(dashGeo, dashMat);
    m.rotation.x = -Math.PI/2; m.position.set(lx, 0.005, 6 - i*7.5);
    scene.add(m); dashes.push(m);
  }

/* ---------- 尾灯光晕 ---------- */
// 灯罩上色不等于"亮"。真实尾灯看到的是光在往外散，所以用加性混合的柔光贴图
// 叠在灯的位置上：夜间是常亮的微光，踩刹车时更亮、晕开得更大。
function glowTexture(){
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const x = cv.getContext('2d');
  // 氛围灯式衰减：中心不给白热芯（加性混合下白芯会烧成"两个太阳"），
  // 而是直接从半亮红起步，再缓慢铺开
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0,   'rgba(255,62,44,.50)');
  g.addColorStop(.22, 'rgba(230,30,26,.38)');
  g.addColorStop(.50, 'rgba(192,14,18,.20)');
  g.addColorStop(.76, 'rgba(150,6,14,.07)');
  g.addColorStop(1,   'rgba(140,0,16,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(cv);
}
const glowTex = glowTexture();
function plateTexture(){                                   // 车牌灯：暖白、横向铺开
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const x = cv.getContext('2d');
  x.save(); x.translate(64,64); x.scale(1, 0.5);
  const g = x.createRadialGradient(0, 0, 0, 0, 0, 64);
  g.addColorStop(0, 'rgba(255,240,214,.42)'); g.addColorStop(.42, 'rgba(255,234,204,.20)');
  g.addColorStop(1, 'rgba(255,228,196,0)');
  x.fillStyle = g; x.beginPath(); x.arc(0, 0, 64, 0, 7); x.fill(); x.restore();
  return new THREE.CanvasTexture(cv);
}
const PLATE_TEX = plateTexture();
function headTexture(){                                   // 前大灯：冷白，中心不烧穿
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const x = cv.getContext('2d');
  const g = x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,   'rgba(238,246,255,.72)');
  g.addColorStop(.30, 'rgba(214,232,255,.34)');
  g.addColorStop(.62, 'rgba(180,210,255,.10)');
  g.addColorStop(1,   'rgba(160,200,255,0)');
  x.fillStyle = g; x.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(cv);
}
const HEAD_TEX = headTexture();
let plateLamp = null;
let brakeGlow = 0, tailSprites = [];

// GPS 也没有刹车踏板信号，只能由减速度反推。
// 注意：GPS 大约 1Hz 才更新一次，逐帧对车速求导会算出 +9.6 m/s² 这种不可能的值，
// 所以改成固定 2.5s 窗口上做差分，并夹到物理合理范围。
const AWIN = 2.5;
let hist = [], aSmooth = 0;
function updateBrake(dt){
  if(dt <= 0) return;
  const t = lastTs;
  hist.push([t, D.speed]);
  while(hist.length > 2 && t - hist[0][0] > AWIN) hist.shift();
  const span = hist[hist.length-1][0] - hist[0][0];
  if(span < 0.8) return;                                  // 窗口太短，别急着出数
  const a = Math.max(-6, Math.min(6,
    (hist[hist.length-1][1] - hist[0][1]) / 3.6 / (span/1000)));
  aSmooth += (a - aSmooth) * Math.min(1, dt * 3);
  const want = aSmooth < -0.5 ? Math.min(1, -aSmooth / 2.2) : 0;
  brakeGlow += (want - brakeGlow) * Math.min(1, dt * (want > brakeGlow ? 10 : 3));
}
function applyTailGlow(){
  const base = mq.matches ? 0.34 : 0;                  // 夜间示廓常亮，白天只跟刹车
  const k = Math.min(1, base + brakeGlow);
  // 白天必须单独收紧：加性混合叠在近白背景上会把红推成粉白，反而更像"放了两个太阳"。
  // 真车白天看刹车灯也是小而饱和的红点，不是大光晕。
  const peak = mq.matches ? 0.42 : 0.18, spread = mq.matches ? 1 : 0.78;
  for(const sp of tailSprites){
    sp.material.opacity = k > 0.02 ? 0.08 + peak * k : 0;   // 白天没刹车=全灭
    const sc = (1.05 + 0.35 * k) * spread;                  // 夜间范围更大、强度更低
    sp.scale.set(sc, sc * 0.9, 1);
  }
  for(const m of tailMats) m.emissiveIntensity = 0.85 * k;
  const hlOn = mq.matches ? 1 : 0;                 // 夜间（含停车）前大灯常亮
  for(const sp of headSprites) sp.material.opacity = hlOn;
  window.__lights = { brake:+brakeGlow.toFixed(2), a:+aSmooth.toFixed(2), k:+k.toFixed(2) };
}

/* ---------- 车内乘客：毛绒兔 + 贴纸脸棉花糖 ---------- */
// 车组绕 Y 转了 180°，所以局部 +X 是驾驶侧（菲律宾左舵）、局部 +Z 是车头。
// 乘客朝车头、略向内偏，再往后靠着椅背坐（backward pitch）并轻微侧倾（roll），呈放松斜靠姿态。
const RIDERS = [
  {kind:'mallow', x: 0.36, y:0.72, z:0.30, yaw: -0.30, lean:-0.34, roll: 0.16, scale:2.2, obj:null, pose:{pitch:0, roll:0, dy:0}},
  {kind:'bunny',  x:-0.36, y:0.50, z:0.30, yaw:  0.30, lean:-0.34, roll:-0.16, scale:1.7, obj:null, pose:{pitch:0, roll:0, dy:0}},
];
const RIDER_SCALE = 1.0;
// 调试开关都走网址 hash，可以叠着用：#park-mark-ghost-xray
// hash 在无头/自动化浏览器里会被丢掉，所以 query 也认：?probe=1
const DBG = location.hash + location.search;
const FORCE_PARK = /park/.test(DBG);    // 锁在环绕视角，方便标定
const MARK_RIDERS = /mark/.test(DBG);   // 画出乘客落座基准块
const GHOST_RIDERS = /ghost/.test(DBG); // 乘客忽略深度：区分"被车顶挡住"和"根本没画出来"
const XRAY = /xray/.test(DBG);          // 车身半透，用来看座位到底在哪
const PROBE_RIDERS = /probe/.test(DBG); // 从跟车相机打射线，报告乘客被谁挡住

function plushTex(top, bottom){          // 毛绒渐变：canvas 顶边对应球体 UV v=1（北极）
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'), g = x.createLinearGradient(0,0,0,64);
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  x.fillStyle = g; x.fillRect(0,0,64,64);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
function faceTex(){                      // 贴纸风脸：粗描边 + 平涂，本身不吃光照
  const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d');
  x.fillStyle = '#22242c';
  for(const ex of [86,170]){ x.beginPath(); x.ellipse(ex,112,15,19,0,0,Math.PI*2); x.fill(); }
  x.fillStyle = '#ffffff';
  for(const ex of [81,165]){ x.beginPath(); x.ellipse(ex,105,5,6,0,0,Math.PI*2); x.fill(); }
  x.fillStyle = 'rgba(255,146,172,.6)';
  for(const bx of [56,200]){ x.beginPath(); x.ellipse(bx,146,21,12,0,0,Math.PI*2); x.fill(); }
  x.strokeStyle = '#22242c'; x.lineWidth = 9; x.lineCap = 'round';
  x.beginPath(); x.moveTo(104,146); x.quadraticCurveTo(128,172,152,146); x.stroke();
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
const FACE_TEX = faceTex();

// 超椭球：沿单位方向 u 解 (|x/a|^n + |y/b|^n + |z/c|^n = 1) 的交点，n 越大越方。
// 棉花糖要的是圆角方块，直接把球压扁只会变成蛋。
function blobGeom(a, b, c, n, ws, hs){
  const g = new THREE.SphereGeometry(1, ws||36, hs||26), p = g.attributes.position, v = new THREE.Vector3();
  for(let i = 0; i < p.count; i++){
    v.fromBufferAttribute(p, i);
    const s = Math.pow(Math.pow(Math.abs(v.x)/a, n) + Math.pow(Math.abs(v.y)/b, n) +
                       Math.pow(Math.abs(v.z)/c, n), 1/n);
    p.setXYZ(i, v.x/s, v.y/s, v.z/s);
  }
  g.computeVertexNormals(); return g;
}
const plushMat = (map, hex) => new THREE.MeshStandardMaterial({
  map: map || null, color: map ? 0xffffff : hex, roughness: 0.92, metalness: 0,
  // 车漆那套强光泽只给车身；毛绒要哑光，否则变成塑料摆件。emissive 只给一点点，
  // 不然夜间模式整个车厢是黑的，乘客完全看不见。
  envMapIntensity: 0.35, emissive: new THREE.Color(hex || 0xf6eef2), emissiveIntensity: 0.14 });
const ell = (mat, a, b, c, n) => new THREE.Mesh(blobGeom(a, b, c, n || 2), mat);

function makeBunny(){
  const g = new THREE.Group();
  const white = plushMat(plushTex('#ffffff', '#ffd2e4'), 0xf7e9ef);
  const pink  = plushMat(null, 0xffb3cd);
  const dark  = plushMat(null, 0x2a2226);
  const body = ell(white, 0.085, 0.105, 0.075); body.position.y = 0.100; g.add(body);
  const head = ell(white, 0.075, 0.068, 0.066); head.position.set(0, 0.238, 0.008); g.add(head);
  const tail = ell(white, 0.022, 0.022, 0.018); tail.position.set(0, 0.085, -0.078); g.add(tail);
  const nose = ell(pink,  0.010, 0.008, 0.008); nose.position.set(0, 0.226, 0.066); g.add(nose);
  for(const sx of [-1, 1]){
    // 耳朵连内耳一起进子组：内耳只是沿局部 +z 前移，跟着耳朵一起歪才不会飘到耳外
    const ear = new THREE.Group();
    ear.position.set(sx*0.033, 0.330, -0.004); ear.rotation.z = sx*0.20; ear.rotation.x = -0.10;
    const out = ell(white, 0.021, 0.078, 0.014); out.position.y = 0.030; ear.add(out);
    const inn = ell(pink,  0.011, 0.058, 0.006); inn.position.set(0, 0.030, 0.012); ear.add(inn);
    g.add(ear);
    const eye  = ell(dark, 0.011, 0.013, 0.010); eye.position.set(sx*0.030, 0.244, 0.058); g.add(eye);
    const arm  = ell(white,0.026, 0.020, 0.030); arm.position.set(sx*0.072, 0.128, 0.026); arm.rotation.z = sx*0.5; g.add(arm);
    const foot = ell(white,0.030, 0.017, 0.046); foot.position.set(sx*0.046, 0.016, 0.052); g.add(foot);
    const blush= ell(pink, 0.017, 0.011, 0.008); blush.position.set(sx*0.047, 0.222, 0.048); g.add(blush);
  }
  return g;
}
function makeMallow(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(blobGeom(0.098, 0.092, 0.086, 4.2), plushMat(plushTex('#ffffff', '#ffd9e8'), 0xf6eef2));
  body.position.y = 0.093; g.add(body);
  for(const sx of [-1, 1]){
    const foot = ell(plushMat(null, 0xffc2d8), 0.030, 0.014, 0.036, 3);
    foot.position.set(sx*0.046, 0.014, 0.030); g.add(foot);
  }
  // 脸是一张贴上去的贴纸：MeshBasic 不吃光照才像印刷品，depthWrite 关掉避免和团子面打架
  const face = new THREE.Mesh(new THREE.PlaneGeometry(0.135, 0.135),
    new THREE.MeshBasicMaterial({map: FACE_TEX, transparent:true, depthWrite:false}));
  face.position.set(0, 0.104, 0.087); g.add(face);
  return g;
}
function addRiders(car){
  for(const r of RIDERS){
    const fig = r.kind === 'bunny' ? makeBunny() : makeMallow();
    fig.scale.setScalar(r.scale || RIDER_SCALE);
    fig.position.set(r.x, r.y, r.z);
    fig.rotation.order = 'YXZ';
    fig.rotation.y = r.yaw;
    fig.rotation.x = r.lean || 0;
    fig.rotation.z = r.roll || 0;
    if(GHOST_RIDERS) fig.traverse(o => { if(o.isMesh){ o.material.depthTest = false; o.renderOrder = 8; } });
    fig.traverse(o => { if(o.isMesh) o.userData.rider = r.kind; });
    r.obj = fig;                                   // 每帧姿态要改这个 Group
    car.add(fig);
    if(MARK_RIDERS){
      const pad = new THREE.Mesh(new THREE.BoxGeometry(0.40, 0.010, 0.40),
        new THREE.MeshBasicMaterial({color:0xff00ff, depthTest:false, transparent:true, opacity:.9}));
      pad.position.set(r.x, r.y, r.z); pad.renderOrder = 9; car.add(pad);
      const mid = new THREE.Mesh(new THREE.SphereGeometry(0.028, 12, 8),
        new THREE.MeshBasicMaterial({color:0x00ff66, depthTest:false}));
      mid.position.set(r.x, r.y + 0.24, r.z); mid.renderOrder = 9; car.add(mid);
    }
  }
}

/* ---------- 乘客姿态：一套数值，车内模型和左下角特写共用 ---------- */
// 输入全是页面里已经有的量：aSmooth 纵向加速度(m/s²，负=刹车)、yawRate 航向角速度
// (rad/s，正=右转)、shown.speed、停稳时长。两处渲染只读 r.pose，所以动作必然一致。
let yawRate = 0, stillSec = 0;
const RSM = RIDERS.map(() => ({p:0, r:0, y:0}));   // 平滑后的姿态，路面抖动另加

function updateRiderPose(dt, t){
  stillSec = shown.speed > 0.5 ? 0 : stillSec + dt;
  // 停稳 25s 后打瞌睡，8s 内睡熟：头往前垂、呼吸变深变慢
  const sleepy = clamp01((stillSec - 25) / 8);
  const live   = D.connected ? 1 : 0;
  const brake  = Math.max(0, -aSmooth) * live;
  const accel  = Math.max(0,  aSmooth) * live;
  const turn   = Math.max(-0.7, Math.min(0.7, yawRate)) * live;
  RIDERS.forEach((r, i) => {
    const ph = i * 1.9, g = i ? 0.86 : 1;          // 两人错开相位、幅度略差，别像复制粘贴
    const breath = Math.sin(t * (sleepy > 0.5 ? 0.72 : 1.5) + ph);
    const road   = Math.sin(t * 12.4 + ph * 2) * Math.min(1, shown.speed / 70);
    const pT = brake * 0.075 * g - accel * 0.04 * g + sleepy * 0.22 + breath * 0.03 * (1 + sleepy * 0.8);
    const rT = -turn * 0.30 * g + breath * 0.008;
    const yT = breath * 0.012 * (1 + sleepy * 1.6);
    const k  = Math.min(1, dt * (sleepy > 0.5 ? 1.8 : 5));
    const s  = RSM[i];
    s.p += (pT - s.p) * k;  s.r += (rT - s.r) * k;  s.y += (yT - s.y) * k;
    r.pose.pitch = s.p + road * 0.009;             // 路面细抖不过平滑，直接叠上去
    r.pose.roll  = s.r + road * 0.007;
    r.pose.dy    = s.y + road * 0.003;
    if(r.obj){
      r.obj.rotation.x = r.lean + r.pose.pitch;
      r.obj.rotation.z = r.roll + r.pose.roll;
      r.obj.position.y = r.y + r.pose.dy;
    }
  });
}

/* ---------- 左下角浮动白猫：第二个 WebGL 上下文，姿态读车内共用的 r.pose ---------- */
// 模型 = Vuena 的 CC0 猫（https://vuena.itch.io/blocky-pets-wildlife），贴图被重绘成白色异瞳
// 波斯猫、删掉了 LOD1。base64 内联在本页而不是另存文件：原生壳的 WebSync 只同步这一个 HTML，
// 多一个资产文件就要重装 ipa 才能到车上。
// 猫正对镜头、车内是从车后看，左右相反 → roll 取负、pitch 不取负，屏幕上两边倒向才一致。
let CAT = null;
const CAT_POS = { x: null, y: null };

function b64ToURL(b64){
  if(!b64) return null;
  const bin = atob(b64), u8 = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([u8], { type:'model/gltf-binary' }));
}
function catPlace(){
  if(!CAT) return;
  if(CAT_POS.x === null || CAT_POS.y === null){
    // 默认落左下角；窄窗口常用条会折成两行，得整个让开
    CAT_POS.x = 10;
    CAT_POS.y = innerHeight - CAT.box.offsetHeight - (innerWidth <= 640 ? 168 : 92);
  }
  CAT.box.style.left = Math.round(CAT_POS.x) + 'px';
  CAT.box.style.top  = Math.round(CAT_POS.y) + 'px';
}
function catClamp(){
  if(!CAT) return;
  catPlace();
  const r = CAT.box.getBoundingClientRect();
  if(!r.width) return;
  CAT_POS.x = Math.min(Math.max(CAT_POS.x, 4), Math.max(4, innerWidth - r.width - 4));
  CAT_POS.y = Math.min(Math.max(CAT_POS.y, 4), Math.max(4, innerHeight - r.height - 4));
  catPlace();
}
function catClip(name, once){
  if(!CAT || !CAT.mix || CAT.cur === name || !CAT.clips[name]) return;
  const a = CAT.mix.clipAction(CAT.clips[name]);
  a.reset().setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, Infinity).play();
  if(CAT.cur && CAT.clips[CAT.cur]) a.crossFadeFrom(CAT.mix.clipAction(CAT.clips[CAT.cur]), 0.45, false);
  CAT.cur = name;
}
// 停车打瞌睡演 sleep，平时演 idle，中间每隔 18~40s 从剩下 10 段里随机挑一段演完就回来。
function catTick(t){
  if(!CAT || !CAT.root) return;
  if(stillSec > 25){ catClip('sleep'); CAT.until = 0; return; }
  if(CAT.cur === 'sleep') catClip('idle');
  if(CAT.until && t > CAT.until){ catClip('idle'); CAT.until = 0; }
  if(!CAT.until && t > CAT.nextAt){
    CAT.nextAt = t + 18 + Math.random()*22;
    const name = CAT.pool[(Math.random()*CAT.pool.length)|0];
    if(name){ catClip(name, true); CAT.until = t + CAT.clips[name].duration + 0.3; }
  }
}
function initCat(){
  const cv = document.getElementById('catCv'), box = document.getElementById('cat');
  let r;
  try{ r = new THREE.WebGLRenderer({ canvas:cv, antialias:true, alpha:true }); }
  catch(e){ box.classList.add('gone'); return; }              // 建不出上下文就整只收起
  r.setPixelRatio(Math.min(devicePixelRatio||1, 2));
  r.outputEncoding = THREE.sRGBEncoding;
  // WKWebView 在内存压力下会主动回收 WebGL 上下文，而这台车机要连续跑几个小时。
  // 猫是页面里的第二个上下文：它被回收就整只收起来，别让屏幕留一块黑，下次启动再建。
  cv.addEventListener('webglcontextlost', e => {
    e.preventDefault(); CAT = null; box.classList.add('gone');
  }, false);
  const sc = new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xffffff, 0xd8e2f2, 0.95));
  const key = new THREE.DirectionalLight(0xffffff, 1.15); key.position.set(1.4, 2.6, 2.4); sc.add(key);
  const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 20);
  cam.position.set(0, 0.36, 1.24); cam.lookAt(0, 0.26, 0);
  CAT = { r, sc, cam, cv, box, root:null, mix:null, clips:{}, cur:'', w:0, h:0,
          until:0, nextAt:12, pool:[] };
  const p = /^(\d+),(\d+)$/.exec(lyrStore('cat.pos') || '');
  if(p){ CAT_POS.x = +p[1]; CAT_POS.y = +p[2]; }
  catClamp();

  box.addEventListener('pointerdown', e => {
    const x0 = e.clientX, y0 = e.clientY, px0 = CAT_POS.x, py0 = CAT_POS.y;
    let moved = false;
    try{ box.setPointerCapture(e.pointerId); }catch(err){}
    const move = ev => {
      const dx = ev.clientX - x0, dy = ev.clientY - y0;
      if(!moved){
        if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;       // 8px 以内算点击，别误拖
        moved = true;
        box.classList.add('dragging');
      }
      CAT_POS.x = px0 + dx; CAT_POS.y = py0 + dy;
      catClamp();
    };
    const up = () => {
      box.removeEventListener('pointermove', move);
      box.removeEventListener('pointerup', up);
      box.removeEventListener('pointercancel', up);
      box.classList.remove('dragging');
      if(moved) lyrStore('cat.pos', Math.round(CAT_POS.x) + ',' + Math.round(CAT_POS.y));
    };
    box.addEventListener('pointermove', move);
    box.addEventListener('pointerup', up);
    box.addEventListener('pointercancel', up);
  });

  const url = b64ToURL(window.__CAT_GLB);
  if(!url){ box.classList.add('gone'); return; }
  new THREE.GLTFLoader().load(url, g => {
    if(!CAT) return;                                          // 加载回来时上下文已被回收
    const root = new THREE.Group();
    root.rotation.order = 'YXZ';
    root.add(g.scene);
    sc.add(root);
    CAT.root = root;
    CAT.mix = new THREE.AnimationMixer(g.scene);
    for(const c of g.animations) CAT.clips[c.name] = c;
    CAT.pool = Object.keys(CAT.clips).filter(n => n !== 'idle' && n !== 'sleep');
    catClip('idle');
  }, undefined, e => { box.classList.add('gone'); });         // 模型没到就不留空位
}
function drawCat(dt, t){
  if(!CAT) return;
  const w = CAT.cv.clientWidth, h = CAT.cv.clientHeight;
  if(!w || !h) return;
  if(w !== CAT.w || h !== CAT.h){
    CAT.w = w; CAT.h = h;
    CAT.r.setSize(w, h);
    CAT.cam.aspect = w/h; CAT.cam.updateProjectionMatrix();
  }
  if(CAT.root){
    const p = RIDERS[0].pose;
    CAT.root.rotation.x = p.pitch;
    CAT.root.rotation.z = -p.roll;
    catTick(t);
    CAT.mix.update(dt);
  }
  CAT.r.render(CAT.sc, CAT.cam);
}
initCat();

// 把车漆/内饰壳在腰线以上切成一个半透明"玻璃罩"：下车身保持实心写深度，
// 只有顶盖单独透明且不写深度，跟车相机才能看进车厢看到前排乘客。
const CANOPY_Y = 0.90, CANOPY_ALPHA = 0.22;
function canopySplit(mesh, yCut, alpha){
  mesh.updateWorldMatrix(true, false);
  const g = mesh.geometry.index ? mesh.geometry.toNonIndexed() : mesh.geometry;
  const pos = g.attributes.position, nor = g.attributes.normal, uv = g.attributes.uv;
  const lo = {p:[],n:[],u:[]}, hi = {p:[],n:[],u:[]};
  const v = new THREE.Vector3();
  for(let i = 0; i < pos.count; i += 3){
    let cy = 0;
    for(let k = 0; k < 3; k++){ v.fromBufferAttribute(pos, i+k); mesh.localToWorld(v); cy += v.y; }
    const t = (cy/3) > yCut ? hi : lo;
    for(let k = 0; k < 3; k++){
      t.p.push(pos.getX(i+k), pos.getY(i+k), pos.getZ(i+k));
      if(nor) t.n.push(nor.getX(i+k), nor.getY(i+k), nor.getZ(i+k));
      if(uv)  t.u.push(uv.getX(i+k), uv.getY(i+k));
    }
  }
  const mk = t => {
    const ng = new THREE.BufferGeometry();
    ng.setAttribute('position', new THREE.Float32BufferAttribute(t.p, 3));
    if(t.n.length) ng.setAttribute('normal', new THREE.Float32BufferAttribute(t.n, 3));
    if(t.u.length) ng.setAttribute('uv', new THREE.Float32BufferAttribute(t.u, 2));
    return ng;
  };
  mesh.geometry = mk(lo);
  const cm = [].concat(mesh.material)[0].clone();
  cm.transparent = true; cm.opacity = alpha; cm.depthWrite = false; cm.side = THREE.DoubleSide;
  const top = new THREE.Mesh(mk(hi), cm);
  top.name = mesh.name + '_canopy';
  top.position.copy(mesh.position); top.quaternion.copy(mesh.quaternion); top.scale.copy(mesh.scale);
  top.renderOrder = 5;
  mesh.parent.add(top);
}
// 车漆上的"太阳"是反射出来的，不是贴上去的高光：画一张天光渐变 + 一个亮圆，
// 走 PMREM 生成环境贴图，MeshStandardMaterial 自己会把太阳反到车顶。
function skyTexture(){
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256;
  const x = cv.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#dfe8f2'); g.addColorStop(.40, '#c2d0e0');
  g.addColorStop(.50, '#93a0ad'); g.addColorStop(1, '#242a31');
  x.fillStyle = g; x.fillRect(0, 0, 512, 256);
  const sun = x.createRadialGradient(150, 52, 0, 150, 52, 21);   // 小而亮 = 一道高光
  sun.addColorStop(0, 'rgba(255,255,255,1)');
  sun.addColorStop(.45, 'rgba(255,250,235,.75)');
  sun.addColorStop(1, 'rgba(255,244,220,0)');
  x.fillStyle = sun; x.beginPath(); x.arc(150, 52, 21, 0, 7); x.fill();
  const t = new THREE.Texture(cv);
  t.mapping = THREE.EquirectangularReflectionMapping; t.needsUpdate = true;
  return t;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromEquirectangular(skyTexture()).texture;
pmrem.dispose();
const carMats = [];                      // 收集车身材质，昼夜调节反射强度

// 停车视角的"摄影棚地面"：大而素，靠雾把边缘化掉，避免看到路面尽头
const floor = new THREE.Mesh(new THREE.PlaneGeometry(140, 140),
  new THREE.MeshBasicMaterial({ color: s2l(0xd3dae3), transparent:true, opacity:0, depthWrite:false }));
floor.rotation.x = -Math.PI/2; floor.position.y = -0.012; floor.renderOrder = 1;
scene.add(floor);
let mirrorRoot = null;

/* ---------- 毛玻璃倒影 ---------- */
// 倒影单独渲染到一张低分辨率离屏缓冲，再由地面四边形按屏幕坐标采样并做 3x3 高斯模糊。
// 用 gl_FragCoord 而不是插值 clip 坐标：后者在大四边形上会插值错。
const RT_W = 256, RT_H = 192;   // 故意低分辨率：放大采样时天然带一层柔化
const rt = new THREE.WebGLRenderTarget(RT_W, RT_H, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat });
const reflMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { tMirror:{value:rt.texture}, uStrength:{value:0},
              uTexel:{value:new THREE.Vector2(1/RT_W, 1/RT_H)},
              uVp:{value:new THREE.Vector2(1,1)}, uBlur:{value:4.5} },
  vertexShader: 'void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: [
    'uniform sampler2D tMirror; uniform float uStrength, uBlur;',
    'uniform vec2 uTexel, uVp; varying vec4 dummy;',
    'void main(){',
    '  vec2 suv = gl_FragCoord.xy / uVp;',
    '  if(suv.x<0.0||suv.x>1.0||suv.y<0.0||suv.y>1.0) discard;',
    '  vec2 o = uTexel * uBlur;',
    '  vec4 c = texture2D(tMirror, suv+vec2(-o.x,-o.y))*0.0625',
    '           + texture2D(tMirror, suv+vec2( 0.0 ,-o.y))*0.125',
    '           + texture2D(tMirror, suv+vec2( o.x ,-o.y))*0.0625',
    '           + texture2D(tMirror, suv+vec2(-o.x, 0.0 ))*0.125',
    '           + texture2D(tMirror, suv)                  *0.25',
    '           + texture2D(tMirror, suv+vec2( o.x , 0.0 ))*0.125',
    '           + texture2D(tMirror, suv+vec2(-o.x, o.y ))*0.0625',
    '           + texture2D(tMirror, suv+vec2( 0.0 , o.y ))*0.125',
    '           + texture2D(tMirror, suv+vec2( o.x , o.y ))*0.0625;',
    '  float a = c.a * uStrength;',
    '  if(a < 0.004) discard;',
    '  gl_FragColor = vec4(c.rgb, a);',
    '}'].join('\n'),
});
const reflQuad = new THREE.Mesh(new THREE.PlaneGeometry(140, 140), reflMat);
reflQuad.rotation.x = -Math.PI/2; reflQuad.position.y = -0.010;
reflQuad.renderOrder = 2; reflQuad.visible = false;
scene.add(reflQuad);

/* ---------- 大灯光池 ---------- */
// 相机在车后方，灯罩本身看不见；夜间"开大灯"能被看见的只有铺在路面上的光。
function beamTexture(){
  const cv = document.createElement('canvas'); cv.width = 64; cv.height = 256;
  const x = cv.getContext('2d');
  // 渐变末端(画布底部)对应贴近车头的一侧：实测反了会亮在远处
  const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, 'rgba(255,247,222,0)');
  g.addColorStop(.58, 'rgba(255,247,222,.34)');
  g.addColorStop(1, 'rgba(255,247,222,.95)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 256);
  const h = x.createLinearGradient(0, 0, 64, 0);           // 两侧羽化
  h.addColorStop(0, 'rgba(0,0,0,.9)'); h.addColorStop(.5, 'rgba(0,0,0,0)'); h.addColorStop(1, 'rgba(0,0,0,.9)');
  x.globalCompositeOperation = 'destination-out'; x.fillStyle = h; x.fillRect(0, 0, 64, 256);
  return new THREE.CanvasTexture(cv);
}
const beamTex = beamTexture();
for(const bx of [-0.55, 0.55]){
  const b = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 17),
    new THREE.MeshBasicMaterial({ map:beamTex, transparent:true, opacity:0,
                                  blending:THREE.AdditiveBlending, depthWrite:false, fog:false }));
  b.rotation.x = -Math.PI/2;
  b.position.set(bx, 0.02, -(Z_EGO + CAR_LEN + 8.5));      // 起点贴车头，往前 17m
  scene.add(b); beams.push(b);
}

/* ---------- 车辆模型 ---------- */
// 从内嵌 base64 构造 Blob URL，而不是 fetch .glb：file:// 下 XHR 取同目录文件会被拦
const modelURL = () => b64ToURL(window.__FIESTA_GLB);

new THREE.GLTFLoader().load(modelURL(), g => {
  const obj = g.scene;
  // 作者从 FBX 转出时留了 0.01 的节点缩放，实车 3.97m 会变成 4cm。
  // 不写死倍率：按 Fiesta ST 真实车长把包围盒归一，作者用什么单位都能对上。
  obj.updateMatrixWorld(true);
  let box = new THREE.Box3().setFromObject(obj);
  let size = box.getSize(new THREE.Vector3());
  obj.scale.multiplyScalar(CAR_LEN / Math.max(size.x, size.z));
  obj.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(obj);
  size = box.getSize(new THREE.Vector3());
  const ctr = box.getCenter(new THREE.Vector3());

  // 尾灯：红色主导 + 位于车身两端（座椅也是红的，但在车厢中部，靠位置排除）。
  // 只标记材质，强度交给 applyTheme，夜间才发光。
  const halfLen = size.z/2; let tailBox = null;
  const off = o => { const b = new THREE.Box3().setFromObject(o); return (b.min.z+b.max.z)/2 - ctr.z; };
  // 灯罩材质是和别的部件共用的（红色尾灯材质 = 红色座椅，白色灯罩材质 = 车尾徽标）。
  // 直接改材质会让座椅和徽标一起发光，所以只给命中的 mesh 换一份克隆材质。
  function glowOn(o, m, hex){
    const cm = m.clone();
    cm.emissive = new THREE.Color(hex); cm.emissiveIntensity = 0;
    const ms = [].concat(o.material); ms[ms.indexOf(m)] = cm;
    o.material = ms.length === 1 ? cm : ms;
    return cm;
  }
  // 车漆：原模型是近乎黑的深藏蓝(baseColorFactor 0,0.021,0.222)，调浅并压低粗糙度
  // 让太阳反光拉得出来。同样只改克隆体，不动共享材质。
  function lighten(o, m){
    const cm = m.clone();
    // 粗糙度保持模型原值(0.08)：正是这份镜面度让太阳反成一条高光而不是糊成一层。
    // 金属度拉高 + 反射加强 = 深色漆在高光处显出蓝底，而不是整块死黑。
    cm.color.setHex(PAINT); cm.metalness = Math.max(cm.metalness, 0.88);
    cm.envMapIntensity = SHEEN_DAY;
    const ms = [].concat(o.material); ms[ms.indexOf(m)] = cm;
    o.material = ms.length === 1 ? cm : ms;
    return cm;
  }
  obj.traverse(o => {
    if(!o.isMesh) return;
    for(const m of [].concat(o.material)){
      const c = m && m.color;
      if(!c) continue;
      if(c.b > 1.8*Math.max(c.r, c.g)){ paintMats.push(lighten(o, m)); continue; }  // 蓝色主导 = 车漆
      carMats.push(m);
      if(!(c.r > 1.8*Math.max(c.g, c.b))) continue;
      const z = off(o);
      if(Math.abs(z) > halfLen*0.72){
        tailMats.push(glowOn(o, m, 0xff2d1a)); rearSign = Math.sign(z);
        tailBox = new THREE.Box3().setFromObject(o);          // 记住灯的实际位置
      }
    }
  });
  if(XRAY) for(const m of paintMats.concat(carMats)){
    m.transparent = true; m.opacity = 0.14; m.depthWrite = false;
  }
  obj.position.set(-ctr.x, -box.min.y, -ctr.z);           // 居中 + 落地

  const car = new THREE.Group(); car.add(obj);
  if(tailBox){
    const plateY = (tailBox.min.y + tailBox.max.y)/2 - 0.02 + obj.position.y;   // 灯在牌子上方往下照
    const plate = new THREE.Sprite(new THREE.SpriteMaterial({ map: PLATE_TEX, transparent:true,
      blending: THREE.AdditiveBlending, depthWrite:false, opacity:0 }));
    // 车组绕 Y 转了 180°，局部 +z 反而朝远离相机的方向：必须是减，
    // 加 0.02 会把光晕推到钣金后面被深度测试吃掉（之前就是看不见的原因）
    plate.position.set(obj.position.x, plateY, tailBox.min.z + obj.position.z - 0.14);
    plate.scale.set(0.86, 0.40, 1);
    car.add(plate); plateLamp = plate;
  }
  // 大灯灯罩在这个模型里不是独立 mesh（车头半段只有车标和一个小贴片），
  // 所以不能靠改材质点亮 —— 实测那样会把轮胎照白。改用灯位精灵。
  // 灯位是用硬边标记方块在 3/4 前视里标定出来的（不是按实车尺寸估的）：
  // 方块压住圆形透镜、远侧落在灯外缘时，位置才算对。
  for(const hx of [-0.66, 0.66]){
    const hs = new THREE.Sprite(new THREE.SpriteMaterial({ map: HEAD_TEX, transparent:true,
      blending: THREE.AdditiveBlending, depthWrite:false, opacity:0 }));
    // 要放在车头表面往外一点：往里 10cm 会被鼻锥挡住，从前方看就是灯不亮
    hs.position.set(hx, 0.80, halfLen - 0.16);
    hs.scale.set(0.82, 0.40, 1);
    car.add(hs); headSprites.push(hs);
  }
  if(tailBox){                                                 // 光晕贴在灯罩两端
    const y = (tailBox.min.y + tailBox.max.y)/2 + obj.position.y;
    for(const x of [tailBox.min.x, tailBox.max.x]){
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent:true,
        blending: THREE.AdditiveBlending, depthWrite:false, opacity:0 }));
      sp.position.set(x + obj.position.x, y, tailBox.min.z + obj.position.z);
      car.add(sp); tailSprites.push(sp);
    }
  }
  addRiders(car);
  car.rotation.y = CAR_YAW;
  car.position.set(0, 0, -(Z_EGO + size.z/2));            // 车尾对齐 Z_EGO
  scene.add(car);
  car.updateMatrixWorld(true);
  const shells = [];
  obj.traverse(o => {
    if(o.isMesh && !/_canopy$/.test(o.name) &&
       (/M_Paint_Metal_High/.test(o.name) || /M_Internal_Interior_High/.test(o.name))) shells.push(o);
  });
  for(const o of shells) canopySplit(o, CANOPY_Y, CANOPY_ALPHA);
  if(PROBE_RIDERS){
    CAM.mode = 'drive'; CAM.k = 1; updateCamera(0);
    car.updateMatrixWorld(true);
    const ray = new THREE.Raycaster();
    const L = ['drive cam (' + camera.position.x.toFixed(2) + ',' + camera.position.y.toFixed(2) + ',' + camera.position.z.toFixed(2) + ')'];
    // 扫一张落座网格：每个 (y,z) 当作坐垫高度，头顶取 +0.30m，只看车身（不含乘客）挡不挡
    const ys = [0.45, 0.55, 0.65, 0.75], zs = [0.60, 0.45, 0.30, 0.15, 0.00];
    L.push('cell = z:VISIBLE | z:blocker@dist   (head = seat y + 0.30)');
    for(const y of ys){
      const row = [];
      for(const z of zs){
        const p = new THREE.Vector3(0.36, y + 0.30, z); car.localToWorld(p);
        const dir = p.clone().sub(camera.position), dist = dir.length();
        ray.set(camera.position, dir.normalize());
        const hits = ray.intersectObject(obj, true);
        let blocker = null, glass = null;
        for(const h of hits){
          const m = [].concat(h.object.material)[0];
          if(m && m.transparent){ if(!glass) glass = h; continue; }
          blocker = h; break;
        }
        const nm = blocker ? (blocker.object.name.split('M_')[1] || blocker.object.name).slice(0, 22) : '';
        row.push(z.toFixed(2) + ':' + (!blocker || blocker.distance > dist ? 'VISIBLE' : nm + '@' + blocker.distance.toFixed(2)) + (glass ? '(glass)' : ''));
      }
      L.push('seat y=' + y.toFixed(2) + '  ' + row.join(' | '));
    }
    const pre = document.createElement('pre');
    pre.id = 'probeout';
    pre.style.cssText = 'position:fixed;left:0;top:0;z-index:99;margin:0;padding:4px;background:#fff;color:#000;font:11px monospace';
    pre.textContent = L.join('\n');
    document.body.appendChild(pre);
  }
  // 倒影 = 把车组镜像到地面以下。clone() 默认共享材质，必须逐个 clone 材质，
  // 否则改倒影的透明度会把真车一起改透明。
  mirrorRoot = new THREE.Group();
  const mir = car.clone(true);
  mir.traverse(o => {
    o.renderOrder = 2;
    if(o.isSprite){ o.visible = false; return; }        // 灯晕不参与倒影
    if(!o.isMesh) return;
    const ms = [].concat(o.material).map(m => {
      const cm = m.clone();
      cm.transparent = true; cm.opacity = 1.0;   // 离屏通道里要的是纯覆盖度，强度由着色器决定
      // 深度测试和写入都要开着：关掉会让镜像的远面穿过近面，倒影变成 X 光片。
      // 地板是 depthWrite:false 且不写深度，所以不会把倒影挡掉。
      cm.depthWrite = true; cm.depthTest = true;
      cm.side = THREE.DoubleSide;                       // Y 翻转后绕序反了，否则面会被剔掉
      return cm;
    });
    o.material = ms.length === 1 ? ms[0] : ms;
    ms.forEach(m => mir2fade.push(m));
  });
  mirrorRoot.scale.set(1, -0.55, 1);
  mirrorRoot.add(mir);
  scene.add(mirrorRoot);
  mirrorRoot.visible = false;        // 只作为离屏烘源，不直接参与主通道

  carCenter.set(0, size.y*0.5, -(Z_EGO + size.z/2));
  window.__car = { size, tailMats: tailMats.length, rearSign, halfLen:+halfLen.toFixed(2) };

  applyTheme();                      // 模型是异步来的，首帧那次 applyTheme 里还没有尾灯材质
  document.getElementById('load').className = 'hidden';
  console.info('Fiesta ready:' + size.z.toFixed(2) + 'm long × ' + size.x.toFixed(2) + 'm wide × ' + size.y.toFixed(2) + 'm tall, tail-light materials: ' + tailMats.length + '');
}, undefined,
e => {
  const el=document.getElementById('load');
  el.className='bad'; el.textContent='Model failed to load:'+(e && e.message || e);
});

/* ---------- 昼夜主题 ---------- */
const mq = matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  const t = mq.matches ? THEME.dark : THEME.light;
  scene.background.setHex(t.sky);
  scene.fog.color.copy(s2l(t.sky));
  for(const k of ['road','shoulder','edge'])
    for(const m of (ground[k]||[])) m.material.color.copy(s2l(t[k]));
  floor.material.color.copy(s2l(t.floor));   // 摄影棚地面也要跟着昼夜，否则黑夜配白地
  dashMat.color.copy(s2l(t.dash));
  TH = t; themeK = mq.matches ? 0.42 : 1; hemi.groundColor.setHex(t.ground);
  applyLighting();
  for(const b of beams) b.material.opacity = t.beam;           // 夜间路面光池
  if(plateLamp) plateLamp.material.opacity = mq.matches ? 0.55 : 0.08;   // 车牌灯随示廓
  // 只有车漆吃强光泽；玻璃、黑色饰件、徽标保持常规反射，否则会一起发亮
  for(const m of carMats) if(m.envMapIntensity !== undefined) m.envMapIntensity = mq.matches ? 0.18 : 0.7;
  for(const m of paintMats) m.envMapIntensity = mq.matches ? SHEEN_NIGHT : SHEEN_DAY;
}
mq.addEventListener ? mq.addEventListener('change', applyTheme) : mq.addListener(applyTheme);

let vw = 0, vh = 0;
function resize(){
  const w = innerWidth, h = innerHeight;
  if(!w || !h || (w===vw && h===vh)) return;
  vw = w; vh = h;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  // 必须让 three 同时更新 canvas 的 CSS 尺寸：传 false 时 Retina(dpr=2) 上
  // canvas 会按绘制缓冲尺寸排版，整个画面放大一倍，车直接被挤出视窗外
  renderer.setSize(w, h);
}
resize();

const mir2fade = [];
// 标线/路肩/边线在停车视角要淡出（用户不想要"斑马线"），换成素地面
const decor = [...ground.road, ...ground.shoulder, ...ground.edge];
function updateFade(){
  const e = ease(clamp01(CAM.k)), inv = 1 - e;
  applyLighting();   // 转场中 CAM.k 每帧在变，灯光必须跟着插值
  for(const m of decor) m.material.opacity = e;
  dashMat.opacity = e;
  floor.material.opacity = 0.95 * inv;
  floor.visible = inv > 0.02;
  const showRefl = !!mirrorRoot && inv > 0.05;
  reflQuad.visible = showRefl;
  // 夜间深色地面更像抛光面，反射反而更强
  reflMat.uniforms.uStrength.value = 0.22 * inv * (mq.matches ? 1.2 : 1);
}


/* ---------- 读数 ---------- */
let tripKm = 0, lastTs = 0, wasDark = null;
document.getElementById('trip').onclick = ()=>{ tripKm = 0; };
function paint(){
  document.getElementById('speed').textContent = Math.round(shown.speed);
  document.getElementById('vTrip').textContent = tripKm.toFixed(1);

  document.getElementById('vAvg').textContent  = tripKm>0.05 && G.movingSec>20
    ? (tripKm/(G.movingSec/3600)).toFixed(0) : '—';
  const acc = G.acc;
  document.getElementById('vPrec').textContent = acc===null ? '—' : acc.toFixed(0)+'m';
  document.getElementById('cPrec').className = 'card'+(acc===null?'':acc>30?' bad':acc>15?' warn':'');

  const st = (!D.connected || CAM.mode==='park') ? 'P' : (shown.speed<2 ? 'N' : 'D');
  document.querySelectorAll('#gearrow i').forEach(i=>i.classList.toggle('dim', i.dataset.g!==st));
  document.getElementById('ready').textContent = D.connected?'READY':'OFF';
  document.getElementById('ready').className   = D.connected?'':'off';
}

function loop(ts){
  const dt = lastTs ? Math.min((ts-lastTs)/1000, 1) : 0;   // 上限 1s，防后台回来灌虚假里程
  lastTs = ts;
  resize();                                                 // 转屏 / 0x0 启动都能自愈
  const isDark = mq.matches;
  if(isDark !== wasDark){ wasDark = isDark; applyTheme(); }
  shown.speed += (D.speed - shown.speed) * 0.18;   // GPS 速度跳变大，这层平滑是必要的
  // 起步立刻转场到驾驶视角；停稳 6s 才回到环绕视角，避免每个红灯都切
  if(FORCE_PARK){ CAM.mode = 'park'; CAM.stopped = 0; }
  else if(shown.speed > 3){ CAM.mode = 'drive'; CAM.stopped = 0; }
  else if(shown.speed < 0.5){ if((CAM.stopped += dt) > 6){ CAM.mode='park'; } }
  else CAM.stopped = 0;
  if(CAM.mode !== lastMode){ lastMode = CAM.mode; updateHint(); }
  updateCamera(dt); updateFade();
  if(D.connected){
    updateBrake(dt); applyTailGlow();
    if(shown.speed > 2) G.movingSec += dt;            // 里程走位移积分，这里只累计行驶时长
    const dz = shown.speed/3.6*dt;
    for(const m of dashes){ m.position.z += dz; if(m.position.z > 8) m.position.z -= 44*7.5; }
  }
  updateRiderPose(dt, ts/1000);
  paint();
  if(!PROBE_RIDERS){ renderFrame(); drawCat(dt, ts/1000); }   // 探针只要数学结果，不烘像素，快一个数量级
  requestAnimationFrame(loop);
}

function renderFrame(){
  // 几何镜像只用于烘进离屏 RT，主通道里必须一直藏着，否则它会和模糊四边形叠加，
  // 看到的是那个没模糊的"第二台车"。
  if(reflQuad.visible && mirrorRoot){
    const stash = [];
    scene.children.forEach(o => {
      if(o.isLight) return;
      stash.push([o, o.visible]);
      o.visible = (o === mirrorRoot);
    });
    const bg = scene.background; scene.background = null;      // RT 要透明底，alpha 即覆盖度
    renderer.setRenderTarget(rt);
    renderer.setClearColor(0x000000, 0); renderer.clear();
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    scene.background = bg;
    stash.forEach(([o,v]) => o.visible = v);
    if(mirrorRoot) mirrorRoot.visible = false;
  }
  reflMat.uniforms.uVp.value.set(renderer.domElement.width, renderer.domElement.height);
  renderer.render(scene, camera);
}

/* ---------- GPS 数据源 ---------- */
// GPS 能给的：速度、位置、精度、航向、高度。
// GPS 给不了的（转速/水温/电压/节气门/故障灯）本版一律不显示。
let GPS_LABEL = 'GPS locked';
const R_E = 6371000;
function hav(lat1, lon1, lat2, lon2){                 // 大圆距离(米)
  const r = Math.PI/180;
  const dLat = (lat2-lat1)*r, dLon = (lon2-lon1)*r;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)**2;
  return 2*R_E*Math.asin(Math.min(1, Math.sqrt(a)));
}
function ingest(lat, lon, speedMs, acc, head, ts){
  G.acc = acc;
  let v = null;
  if(speedMs !== null && speedMs !== undefined) v = Math.abs(speedMs)*3.6;

  if(G.lat !== null){
    const d = hav(G.lat, G.lon, lat, lon);
    const dt = (ts - G.posTs)/1000;
    // 位移推算兜底：Wi-Fi 定位或静止时 coords.speed 是 null
    if(v === null && dt > 0.25 && d < 400) v = d/dt*3.6;
    if(d > 1.5 && d < 300) tripKm += d/1000;          // 丢掉抖动和跳点再计入里程
  }
  if(v === null){ v = D.speed; G.src = 'no speed'; }
  else G.src = speedMs==null ? 'from position' : 'GPS speed';
  D.speed = Math.max(0, Math.min(220, v));
  // 航向角速度（转弯方向，正=右转）：1Hz 的航向在低速时纯属噪声，所以只在 8km/h 以上采信，
  // 角度差折到 ±180°，跨 0/360 不会算出一整圈。
  if(head !== null && head !== undefined){
    const hd = (ts - G.posTs)/1000;
    if(G.head !== null && hd > 0.2 && hd < 3 && D.speed > 8){
      const dh = ((head - G.head) % 360 + 540) % 360 - 180;
      yawRate += (dh*Math.PI/180/hd - yawRate) * 0.45;
    } else yawRate *= 0.8;
    G.head = head;
  }
  G.lat = lat; G.lon = lon; G.posTs = ts;
  if(!D.connected){ D.connected = true; refreshWeather(); }   // 第一个定位点一到就刷新天气
}

/* 真实 GPS：蜂窝/带定位芯片的 iPad 才有 coords.speed；
   纯 Wi-Fi 版会是 null，此时自动退化成上面的位移推算（更抖但能用）。 */
let watchId = null;
function startRealGps(){
  if(!navigator.geolocation) return false;
  GPS_LABEL = 'GPS fix locked';
  watchId = navigator.geolocation.watchPosition(p=>{
    if(!hasFix){ hasFix = true; if(demoTimer){ clearInterval(demoTimer); demoTimer = null; } }
    GPS_LABEL = 'GPS fix locked';
    const c = p.coords;
    ingest(c.latitude, c.longitude, c.speed, c.accuracy,
           c.heading===undefined?null:c.heading, p.timestamp||performance.now());
  }, ()=>{ D.connected = false; if(!hasFix) startDemo(); },
     { enableHighAccuracy:true, maximumAge:0, timeout:20000 });
  return true;
}

/* 演示：按 1Hz 生成定位点（真实 GPS 的更新率就是这个量级），
   静止时 speed 给 null，逼出位移推算那条路。
   只在真实定位不可用时才跑；第一个真实定位点一到就永久停掉，
   否则演示航迹会和真 GPS 挤在同一条 1Hz 序列里，车速来回跳。 */
let hasFix = false, demoTimer = null;
function startDemo(){
  if(demoTimer) return;
  GPS_LABEL = 'Demo track (simulated GPS)';
  const cycle=[0,8,14,22,38,52,64,78,88,96,88,72,55,38,24,12,0];
  const PARKED=6;                                      // 前几拍静止：展示环绕视角与起步转场
  let n=0, lat=14.5995, lon=121.0210, hdg=35;
  demoTimer = setInterval(()=>{
    const f=((n++)%40)/40*cycle.length, i=Math.floor(f), k=f-i;
    const s = n < PARKED ? 0 : cycle[i]+(cycle[(i+1)%cycle.length]-cycle[i])*k;
    const ms = s/3.6, dtSec = 1;
    hdg = (hdg + (s>10? 1.6:0)) % 360;
    const d = ms*dtSec;
    lat += (d*Math.cos(hdg*Math.PI/180))/111320;
    lon += (d*Math.sin(hdg*Math.PI/180))/(111320*Math.cos(lat*Math.PI/180));
    ingest(lat, lon, n<PARKED ? null : ms, 6 + (n%3)*3, hdg, performance.now());
  }, 1000);
}
if(!startRealGps()) startDemo();                        // 没有 geolocation 就直接进演示

// WKWebView 的 loadHTMLString 页面在某些配置下访问 localStorage 会抛 SecurityError，
// 这里全部走 try/catch：读写失败只丢设置，绝不能让整段脚本（连同 keepAwake）停掉。
function lyrStore(k, v){
  try{
    if(v === undefined) return localStorage.getItem(k);
    localStorage.setItem(k, v);
  }catch(e){ return null; }
}
const LYR = {
  on: lyrStore('lyrics.open') !== '0',
  key: '', status: 'idle', title: '', artist: '', art: '',
  lines: [], sig: '',
  base: 0, baseAt: 0, playing: false, rate: 1,
  idx: -2,
  w: 0,          // 0 = 用 CSS 默认宽度；拖动后是用户拉的像素
  rows: 2,       // 可见行数 1–6（拉下边改）
  x: null, y: null   // 浮动卡片左上角；null = 还没摆过，默认落在速度块下面
};
const lyrEl = document.getElementById('lyrics');
const lyrList = document.getElementById('lyrList');
const lyrView = document.getElementById('lyrView');
const lyrMsg = document.getElementById('lyrMsg');
const lyrOpen = document.getElementById('lyrOpen');
const lyrTitleEl = document.getElementById('lyrTitle');
const lyrArtistEl = document.getElementById('lyrArtist');
const lyrArtEl = document.getElementById('lyrArt');

function lyrPos(){
  return LYR.base + (LYR.playing ? (performance.now() - LYR.baseAt) / 1000 * (LYR.rate || 1) : 0);
}
function lyrResync(pos, playing, rate){
  LYR.base = Math.max(0, +pos || 0);
  LYR.baseAt = performance.now();
  LYR.playing = !!playing;
  LYR.rate = (+rate > 0) ? +rate : 1;
  LYR.idx = -2;                       // 重新定位后强制重绘一次
}
function lyrBuild(){
  lyrList.textContent = '';
  const frag = document.createDocumentFragment();
  LYR.lines.forEach(l => {
    const li = document.createElement('li');
    const sp = document.createElement('span');
    sp.textContent = l.text;
    li.appendChild(sp);
    frag.appendChild(li);
  });
  lyrList.appendChild(frag);
  lyrList.style.transform = 'translateY(0)';
  LYR.idx = -2;
}
function lyrChrome(){
  lyrTitleEl.textContent = LYR.title || '—';
  lyrArtistEl.textContent = LYR.artist || '';
  if(LYR.art){
    if(lyrArtEl.getAttribute('src') !== LYR.art) lyrArtEl.src = LYR.art;
    lyrArtEl.classList.remove('hidden');
  }else{
    lyrArtEl.removeAttribute('src');
    lyrArtEl.classList.add('hidden');
  }
  let msg = '';
  if(LYR.status === 'loading') msg = 'Searching lyrics…';
  else if(LYR.status === 'none') msg = 'No synced lyrics for this track';
  else if(LYR.status === 'error') msg = 'Lyrics lookup failed';
  else if(LYR.status === 'denied') msg = 'Allow Media & Apple Music access in Settings';
  else if(!LYR.title) msg = 'Play something in Apple Music';
  else if(!LYR.lines.length && LYR.status === 'ok') msg = 'No synced lyrics for this track';
  lyrMsg.textContent = msg;
  lyrMsg.classList.toggle('hidden', !msg);
  const show = LYR.on && (!!LYR.title || LYR.status === 'denied');
  lyrEl.classList.toggle('hidden', !show);
  lyrOpen.classList.toggle('hidden', !(LYR.title && !LYR.on));
  if(show) lyrClampPlace();             // 藏着时量不到尺寸，显示出来再夹一次
}
function lyrSetTrack(j){
  if(!j || typeof j !== 'object') return;
  LYR.key = String(j.key || '');
  LYR.title = j.title || '';
  LYR.artist = j.artist || '';
  LYR.art = (typeof j.art === 'string') ? j.art : '';
  LYR.status = j.status || 'ok';
  const raw = Array.isArray(j.lines) ? j.lines : [];
  const first = raw[0], last = raw[raw.length - 1];
  const sig = LYR.key + '|' + raw.length + '|' + (Array.isArray(first) ? first[0] : '') + '|' +
              (Array.isArray(last) ? last[0] : '');
  if(sig !== LYR.sig){
    LYR.sig = sig;
    LYR.lines = raw.map(l => Array.isArray(l)
      ? { t: +l[0], text: String(l[1]) }
      : { t: +(l || {}).t, text: String((l || {}).text || '') }
    ).filter(l => isFinite(l.t) && l.text);
    lyrBuild();
  }
  lyrResync(j.position, j.playing, j.rate);
  lyrChrome();
  lyrTick();
}
function lyrSync(j){
  if(!j || typeof j !== 'object') return;
  const pos = +j.position || 0;
  const playing = !!j.playing;
  const est = lyrPos();
  if(playing !== LYR.playing || !playing || Math.abs(est - pos) > 0.35){
    lyrResync(pos, playing, j.rate);
  }else if(+j.rate > 0){
    LYR.rate = +j.rate;
  }
}
function lyrTick(){
  if(!LYR.lines.length) return;
  const now = lyrPos();
  let lo = 0, hi = LYR.lines.length - 1, idx = -1;
  while(lo <= hi){
    const mid = (lo + hi) >> 1;
    if(LYR.lines[mid].t <= now){ idx = mid; lo = mid + 1; }
    else hi = mid - 1;
  }
  if(idx === LYR.idx) return;
  LYR.idx = idx;
  const items = lyrList.children;
  for(let i = 0; i < items.length; i++) items[i].classList.toggle('on', i === idx);
  const lh = lyrView.clientHeight / (LYR.rows || 2);
  const slot = Math.max(0, idx);      // 当前行顶格，下一行跟在下面
  lyrList.style.transform = 'translateY(' + (-slot * lh).toFixed(1) + 'px)';
}

// 松手写进 localStorage，下次启动还原；窗口变窄（台前调度换档）时把宽度夹回上限。
const LYR_MINW = 200, LYR_MAXW = 680, LYR_MINROWS = 1, LYR_MAXROWS = 6;
function lyrMaxW(){ return Math.min(LYR_MAXW, Math.max(LYR_MINW, innerWidth - 24)); }
function lyrApplySize(){
  if(LYR.w > 0) lyrEl.style.width = Math.round(LYR.w) + 'px';
  lyrView.style.setProperty('--rows', LYR.rows);
  lyrView.dataset.rows = LYR.rows;
  LYR.idx = -2;                       // 行高一变，滚动偏移要立刻重画
  lyrClampPlace();                    // 变宽/变高后重新夹回屏幕内
}
function lyrSaveSize(){
  const w = LYR.w > 0 ? LYR.w : Math.round(lyrEl.getBoundingClientRect().width);
  lyrStore('lyrics.size', Math.round(w) + 'x' + LYR.rows);
}
(function lyrLoadSize(){
  const m = /^(\d+)x(\d+)$/.exec(lyrStore('lyrics.size') || '');
  if(m){
    LYR.w = Math.min(Math.max(+m[1], LYR_MINW), LYR_MAXW);
    LYR.rows = Math.min(Math.max(+m[2], LYR_MINROWS), LYR_MAXROWS);
  }
  const p = /^(\d+),(\d+)$/.exec(lyrStore('lyrics.pos') || '');
  if(p){ LYR.x = +p[1]; LYR.y = +p[2]; }
  lyrApplySize();
})();
addEventListener('resize', () => {
  if(LYR.w > lyrMaxW()){ LYR.w = lyrMaxW(); lyrApplySize(); }
  lyrClampPlace();
  catClamp();
});
function lyrBindSize(el, dir){
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    const w0 = LYR.w > 0 ? LYR.w : Math.round(lyrEl.getBoundingClientRect().width);
    const r0 = LYR.rows;
    const lh = parseFloat(getComputedStyle(lyrView).getPropertyValue('--lh')) || 38;
    const x0 = e.clientX, y0 = e.clientY;
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    lyrEl.classList.add('sizing');
    const move = ev => {
      if(dir === 'e' || dir === 'se') LYR.w = Math.round(Math.min(Math.max(w0 + ev.clientX - x0, LYR_MINW), lyrMaxW()));
      if(dir === 's' || dir === 'se') LYR.rows = Math.min(Math.max(r0 + Math.round((ev.clientY - y0) / lh), LYR_MINROWS), LYR_MAXROWS);
      lyrApplySize();
    };
    const up = () => {
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', up);
      lyrEl.classList.remove('sizing');
      lyrSaveSize();
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  });
}
lyrBindSize(document.getElementById('lyrSzE'), 'e');
lyrBindSize(document.getElementById('lyrSzS'), 's');
lyrBindSize(document.getElementById('lyrSzSE'), 'se');

// —— 整张卡片随意拖位置：没摆过时默认落在速度块正下方，摆过就用 localStorage 里的坐标。
function lyrPlace(){
  if(LYR.x === null || LYR.y === null){
    // 左边缘跟速度块对齐；顶边取整条顶栏下面 —— 窄窗口里 OBD 卡片会换到第二行，
    // 只按 #topleft 的下沿摆会正好压在它们上面。
    const tl = document.getElementById('topleft').getBoundingClientRect();
    const tb = document.getElementById('topbar').getBoundingClientRect();
    LYR.x = Math.round(tl.left);
    LYR.y = Math.round(Math.max(tl.bottom, tb.bottom) + 8);
  }
  lyrEl.style.left = Math.round(LYR.x) + 'px';
  lyrEl.style.top = Math.round(LYR.y) + 'px';
}
function lyrClampPlace(){
  lyrPlace();
  const r = lyrEl.getBoundingClientRect();
  if(!r.width) return;                // 卡片藏着时量不到，等显示出来再夹
  LYR.x = Math.min(Math.max(LYR.x, 4), Math.max(4, innerWidth - r.width - 4));
  LYR.y = Math.min(Math.max(LYR.y, 4), Math.max(4, innerHeight - r.height - 4));
  lyrPlace();
}
lyrPlace();
lyrEl.addEventListener('pointerdown', e => {
  if(e.target.closest('.lyrBtn,.lyrSz')) return;   // ✕ 和拉边框各管各的
  const x0 = e.clientX, y0 = e.clientY, px0 = LYR.x, py0 = LYR.y;
  let moved = false;
  try{ lyrEl.setPointerCapture(e.pointerId); }catch(err){}
  const move = ev => {
    const dx = ev.clientX - x0, dy = ev.clientY - y0;
    if(!moved){
      if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;   // 8px 以内算点击，别误拖
      moved = true;
      lyrEl.classList.add('dragging');
    }
    LYR.x = px0 + dx; LYR.y = py0 + dy;
    lyrClampPlace();
  };
  const up = () => {
    lyrEl.removeEventListener('pointermove', move);
    lyrEl.removeEventListener('pointerup', up);
    lyrEl.removeEventListener('pointercancel', up);
    lyrEl.classList.remove('dragging');
    if(moved) lyrStore('lyrics.pos', Math.round(LYR.x) + ',' + Math.round(LYR.y));
  };
  lyrEl.addEventListener('pointermove', move);
  lyrEl.addEventListener('pointerup', up);
  lyrEl.addEventListener('pointercancel', up);
});
